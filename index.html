<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gas Law Practice Master</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbar for modern sleek dark UI */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
  <div id="root" class="min-h-screen flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const R_VALUES = {
      atm: { val: 0.0821, unit: "L·atm/(mol·K)" }
    };

    const IDEAL_GAS_VARIATIONS = {
      standard: {
        name: "Standard Ideal Gas Law",
        formula: "PV = nRT",
        desc: "Relates pressure (P in atm), volume (V in L or mL), moles (n), and temperature (T in °C or K)."
      }
    };

    const PRESSURE_UNITS = ['atm'];
    const VOLUME_UNITS = ['L', 'mL'];

    const toSigFigs = (val, sig = 3) => {
      if (val === null || val === undefined || isNaN(val) || !isFinite(val)) return val;
      return Number(Number(val).toPrecision(sig));
    };

    const toKelvin = (val, unit) => {
      return unit === '°C' ? val + 273.15 : val;
    };

    const FractionExpr = ({ lhs, num, den, className = "" }) => {
      if (!den) {
        return (
          <div className={`inline-flex items-center gap-2 font-mono font-bold ${className}`}>
            {lhs && <span>{lhs} =</span>}
            <span>{num}</span>
          </div>
        );
      }

      return (
        <div className={`inline-flex items-center gap-3 font-mono font-bold ${className}`}>
          {lhs && <span>{lhs} =</span>}
          <div className="inline-flex flex-col items-center justify-center text-center">
            <span className="px-2 py-1 border-b-2 border-current w-full text-center leading-none">{num}</span>
            <span className="px-2 py-1 text-center leading-none">{den}</span>
          </div>
        </div>
      );
    };

    const GasLawFormula = ({ lawKey, className = "" }) => {
      return (
        <div className={`inline-flex items-center gap-2 font-mono font-bold ${className}`}>
          <span>P × V = n × R × T</span>
        </div>
      );
    };

    const getIsolatedFormulaParts = (targetVar) => {
      const parts = {
        P: { num: "n × R × T", den: "V" },
        V: { num: "n × R × T", den: "P" },
        n: { num: "P × V", den: "R × T" },
        T: { num: "P × V", den: "n × R" }
      };
      return parts[targetVar] || { num: "", den: "" };
    };

    const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const randomChoice = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const generateProblem = () => {
      const type = randomChoice(['standard_P', 'standard_V', 'standard_n', 'standard_T']);
      const pUnit = 'atm';
      const vUnit = randomChoice(VOLUME_UNITS);
      const tUnit = randomChoice(['°C', 'K']);
      const rInfo = R_VALUES.atm;

      // Random realistic gas values formatted to at most 3 sig figs
      let n = toSigFigs(randomInt(25, 350) / 100, 3); // 0.25 to 3.5 moles
      let tC = randomInt(5, 95);
      let tK = toSigFigs(tC + 273.15, 3);
      let tVal = tUnit === '°C' ? toSigFigs(tC, 3) : tK;

      let pVal = toSigFigs(randomInt(80, 250) / 100, 3); // pressure in atm

      const gasList = [
        "Oxygen (O₂)",
        "Nitrogen (N₂)",
        "Carbon Dioxide (CO₂)",
        "Helium (He)",
        "Methane (CH₄)",
        "Argon (Ar)"
      ];
      const selectedGas = randomChoice(gasList);

      // Calculate V in Liters from PV = nRT with temperature in Kelvin
      let tKForCalc = tUnit === '°C' ? (tC + 273.15) : tK;
      let vL = (n * rInfo.val * tKForCalc) / pVal;
      let vVal = vUnit === 'mL' ? toSigFigs(vL * 1000, 3) : toSigFigs(vL, 3);

      let target = '';
      let lawKey = 'standard';
      let expectedAnswer = 0;
      let targetUnit = '';
      let text = '';
      let givens = [];

      if (type === 'standard_P') {
        target = 'P';
        expectedAnswer = toSigFigs(pVal, 3);
        targetUnit = pUnit;
        text = `A container holds ${n} moles of ${selectedGas} in a volume of ${vVal} ${vUnit} at a temperature of ${tVal} ${tUnit}. Calculate the pressure inside the container in ${pUnit}.`;
        givens = [
          { id: 'v', label: `${vVal} ${vUnit}`, correctVar: 'V', isVol: true, vVal, vUnit },
          { id: 'n', label: `${n} mol`, correctVar: 'n' },
          { id: 't', label: `${tVal} ${tUnit}`, correctVar: 'T', isTemp: true, tempVal: tVal, unit: tUnit }
        ];
      } else if (type === 'standard_V') {
        target = 'V';
        expectedAnswer = toSigFigs(vVal, 3);
        targetUnit = vUnit;
        text = `What volume (in ${vUnit}) will ${n} moles of ${selectedGas} occupy at a pressure of ${pVal} ${pUnit} and a temperature of ${tVal} ${tUnit}?`;
        givens = [
          { id: 'p', label: `${pVal} ${pUnit}`, correctVar: 'P' },
          { id: 'n', label: `${n} mol`, correctVar: 'n' },
          { id: 't', label: `${tVal} ${tUnit}`, correctVar: 'T', isTemp: true, tempVal: tVal, unit: tUnit }
        ];
      } else if (type === 'standard_n') {
        target = 'n';
        expectedAnswer = toSigFigs(n, 3);
        targetUnit = 'mol';
        text = `How many moles of gas are present in a ${vVal} ${vUnit} vessel containing ${selectedGas} at ${pVal} ${pUnit} pressure and ${tVal} ${tUnit}?`;
        givens = [
          { id: 'p', label: `${pVal} ${pUnit}`, correctVar: 'P' },
          { id: 'v', label: `${vVal} ${vUnit}`, correctVar: 'V', isVol: true, vVal, vUnit },
          { id: 't', label: `${tVal} ${tUnit}`, correctVar: 'T', isTemp: true, tempVal: tVal, unit: tUnit }
        ];
      } else if (type === 'standard_T') {
        target = 'T';
        expectedAnswer = toSigFigs(tVal, 3);
        targetUnit = tUnit;
        text = `A sample containing ${n} moles of ${selectedGas} occupies ${vVal} ${vUnit} at ${pVal} ${pUnit}. What is the temperature of the gas in ${tUnit}?`;
        givens = [
          { id: 'p', label: `${pVal} ${pUnit}`, correctVar: 'P' },
          { id: 'v', label: `${vVal} ${vUnit}`, correctVar: 'V', isVol: true, vVal, vUnit },
          { id: 'n', label: `${n} mol`, correctVar: 'n' }
        ];
      }

      const shuffledGivens = [...givens].sort(() => Math.random() - 0.5);

      return {
        id: Date.now(),
        lawKey,
        text,
        pUnit,
        vUnit,
        tUnit,
        target,
        expectedAnswer,
        targetUnit,
        rValue: rInfo.val,
        rUnit: rInfo.unit,
        givens: shuffledGivens
      };
    };

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        Sparkles: (
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        ),
        Award: (
          <g>
            <circle cx="12" cy="8" r="6" />
            <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" />
          </g>
        ),
        Flame: (
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
        ),
        BookOpen: (
          <g>
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </g>
        ),
        Calculator: (
          <g>
            <rect width="16" height="20" x="4" y="2" rx="2" />
            <line x1="8" x2="16" y1="6" y2="6" />
            <line x1="16" x2="16" y1="14" y2="18" />
            <path d="M16 10h.01" />
            <path d="M12 10h.01" />
            <path d="M8 10h.01" />
            <path d="M12 14h.01" />
            <path d="M8 14h.01" />
            <path d="M12 18h.01" />
            <path d="M8 18h.01" />
          </g>
        ),
        RefreshCw: (
          <g>
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </g>
        ),
        Info: (
          <g>
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4" />
            <path d="M12 8h.01" />
          </g>
        ),
        Tag: (
          <g>
            <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z" />
            <line x1="7" x2="7.01" y1="7" y2="7" />
          </g>
        ),
        Zap: (
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        ),
        ArrowRight: (
          <g>
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </g>
        ),
        CheckCircle2: (
          <g>
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
            <path d="m9 12 2 2 4-4" />
          </g>
        ),
        XCircle: (
          <g>
            <circle cx="12" cy="12" r="10" />
            <path d="m15 9-6 6" />
            <path d="m9 9 6 6" />
          </g>
        ),
        ChevronRight: (
          <path d="m9 18 6-6-6-6" />
        ),
        Check: (
          <path d="M20 6 9 17l-5-5" />
        ),
        Thermometer: (
          <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" />
        ),
        X: (
          <g>
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </g>
        )
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {icons[name] || null}
        </svg>
      );
    };

    function App() {
      const [appMode, setAppMode] = useState('problem');
      const [problem, setProblem] = useState(null);
      const [currentStep, setCurrentStep] = useState(1);
      const [autoRedirectMessage, setAutoRedirectMessage] = useState(false);
      
      // Step 1 State
      const [userAssignments, setUserAssignments] = useState({}); 
      const [userTargetVar, setUserTargetVar] = useState('');
      const [kelvinInputs, setKelvinInputs] = useState({}); 
      const [literInputs, setLiterInputs] = useState({});
      const [selectedR, setSelectedR] = useState('');
      const [step1Error, setStep1Error] = useState('');

      // Step 2 State
      const [selectedLaw, setSelectedLaw] = useState('');
      const [step2Error, setStep2Error] = useState('');

      // Step 3 & 4 State
      const [step3Confirmed, setStep3Confirmed] = useState(false);
      const [userAnswer, setUserAnswer] = useState('');
      const [step4Result, setStep4Result] = useState(null);

      // Stats & Tools
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [completedCount, setCompletedCount] = useState(0);
      const [showReference, setShowReference] = useState(false);
      const [showCalculator, setShowCalculator] = useState(false);

      // Scratchpad state
      const [calcC, setCalcC] = useState('');
      const [calcK, setCalcK] = useState('');

      useEffect(() => {
        loadNewProblem();
      }, []);

      const loadNewProblem = () => {
        const newProb = generateProblem();
        setProblem(newProb);
        setAppMode('problem');
        setCurrentStep(1);
        setUserAssignments({});
        setUserTargetVar('');
        setKelvinInputs({});
        setLiterInputs({});
        setSelectedR('');
        setStep1Error('');
        setSelectedLaw('');
        setStep2Error('');
        setStep3Confirmed(false);
        setUserAnswer('');
        setStep4Result(null);
        setAutoRedirectMessage(false);
      };

      if (!problem) return null;

      const handleVerifyStep1 = () => {
        setStep1Error('');

        for (const item of problem.givens) {
          if (!userAssignments[item.id]) {
            setStep1Error(`Please select a variable tag (P, V, n, T) for measurement "${item.label}".`);
            return;
          }
          if (userAssignments[item.id] !== item.correctVar) {
            setStep1Error(`Incorrect variable assignment for "${item.label}". Double check units (e.g. atm=P, L/mL=V, mol=n, K/°C=T).`);
            return;
          }
        }

        if (!userTargetVar) {
          setStep1Error(`Please select the unknown target variable you are solving for.`);
          return;
        }

        if (userTargetVar !== problem.target) {
          setStep1Error(`Target variable mismatch! The question asks for ${problem.targetUnit}, which corresponds to '${problem.target}'.`);
          return;
        }

        for (const item of problem.givens) {
          if (item.isTemp && item.unit === '°C') {
            const expectedK = toSigFigs(toKelvin(item.tempVal, item.unit), 3);
            const userK = parseFloat(kelvinInputs[item.id]);
            if (isNaN(userK) || (Math.abs(userK - expectedK) > 1 && toSigFigs(userK, 3) !== expectedK)) {
              setStep1Error(`Check your Kelvin conversion for ${item.label}! K = °C + 273.15 (Expected ~${expectedK} K).`);
              return;
            }
          }
          if (item.isVol && item.vUnit === 'mL') {
            const expectedL = toSigFigs(item.vVal / 1000, 3);
            const userL = parseFloat(literInputs[item.id]);
            if (isNaN(userL) || (Math.abs(userL - expectedL) > 0.01 && toSigFigs(userL, 3) !== expectedL)) {
              setStep1Error(`Check volume conversion for ${item.label}! Ideal Gas Law requires volume in Liters (L = mL / 1000). Expected ~${expectedL} L.`);
              return;
            }
          }
        }

        if (!selectedR || parseFloat(selectedR) !== problem.rValue) {
          setStep1Error(`Select the correct Gas Constant R value matching pressure unit '${problem.pUnit}'. (For ${problem.pUnit}, R = ${problem.rValue} ${problem.rUnit}).`);
          return;
        }

        setCurrentStep(2);
      };

      const handleVerifyStep2 = () => {
        setStep2Error('');
        if (selectedLaw !== problem.lawKey) {
          setStep2Error(`Select standard Ideal Gas Law equation PV = nRT.`);
          return;
        }
        setCurrentStep(3);
      };

      const handleConfirmStep3 = () => {
        setStep3Confirmed(true);
        setCurrentStep(4);
      };

      const handleVerifyAnswer = () => {
        const numericAns = parseFloat(userAnswer);
        if (isNaN(numericAns)) {
          setStep4Result({ correct: false, msg: 'Please enter a valid numeric value.' });
          return;
        }

        const expected = toSigFigs(problem.expectedAnswer, 3);
        const userSig = toSigFigs(numericAns, 3);
        const tolerance = Math.abs(expected * 0.03); // 3% tolerance
        const isCorrect = Math.abs(numericAns - expected) <= Math.max(tolerance, 0.05) || userSig === expected;

        if (isCorrect) {
          setStep4Result({
            correct: true,
            msg: `🎉 Excellent work! Your answer (${userSig} ${problem.targetUnit}) is correct (to 3 sig figs)!`
          });
          setScore(prev => prev + (appMode === 'problem' ? 150 : 100) + streak * 10);
          setStreak(prev => prev + 1);
          setCompletedCount(prev => prev + 1);
        } else {
          setStreak(0);
          setStep4Result({
            correct: false,
            msg: `Incorrect calculation. Expected value (to 3 sig figs) is ${expected} ${problem.targetUnit}.`
          });
        }
      };

      const ALL_VARS = ['P', 'V', 'n', 'T'];
      const activeTarget = userTargetVar || problem.target;

      const getValForVar = (v) => {
        if (v === activeTarget) return '?';
        if (v === 'R') return problem.rValue;
        const item = problem.givens.find(g => userAssignments[g.id] === v || g.correctVar === v);
        if (!item) return v;
        if (item.isTemp) {
          const kVal = kelvinInputs[item.id] ? parseFloat(kelvinInputs[item.id]) : toSigFigs(toKelvin(item.tempVal, item.unit), 3);
          return `${toSigFigs(kVal, 3)} K`;
        }
        if (item.isVol && item.vUnit === 'mL') {
          const lVal = literInputs[item.id] ? parseFloat(literInputs[item.id]) : toSigFigs(item.vVal / 1000, 3);
          return `${toSigFigs(lVal, 3)} L`;
        }
        return item.label;
      };

      const isolatedParts = getIsolatedFormulaParts(activeTarget);

      const replaceVarsInExpr = (expr) => {
        if (!expr) return "";
        return expr
          .replace(/\bP\b/g, getValForVar('P'))
          .replace(/\bV\b/g, getValForVar('V'))
          .replace(/\bn\b/g, getValForVar('n'))
          .replace(/\bR\b/g, problem.rValue)
          .replace(/\bT\b/g, getValForVar('T'));
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white">
          
          {/* HEADER NAVBAR */}
          <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-4 py-3 sm:px-8 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="bg-gradient-to-tr from-indigo-500 to-sky-400 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                <Icon name="Sparkles" className="w-6 h-6 text-white" />
              </div>
              <div>
                <h1 className="font-bold text-lg sm:text-xl bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                  Ideal Gas Law Master (PV = nRT)
                </h1>
                <p className="text-xs text-slate-400">Step-by-Step PV=nRT & Variation Solver</p>
              </div>
            </div>

            {/* STATS & QUICK TOOLS */}
            <div className="flex items-center space-x-3 sm:space-x-6 text-sm">
              <div className="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                <Icon name="Award" className="w-4 h-4 text-amber-400" />
                <span className="text-slate-400 font-medium">Score:</span>
                <span className="font-bold text-amber-400">{score}</span>
              </div>

              <div className="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                <Icon name="Flame" className="w-4 h-4 text-orange-500" />
                <span className="text-slate-400 font-medium">Streak:</span>
                <span className="font-bold text-orange-400">{streak}</span>
              </div>

              <button
                onClick={() => setShowReference(true)}
                className="flex items-center space-x-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-medium transition text-xs sm:text-sm shadow-sm"
              >
                <Icon name="BookOpen" className="w-4 h-4" />
                <span className="hidden sm:inline">PV=nRT Cheat Sheet</span>
              </button>

              <button
                onClick={() => setShowCalculator(!showCalculator)}
                className="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-medium border border-slate-700 transition text-xs sm:text-sm"
              >
                <Icon name="Calculator" className="w-4 h-4 text-sky-400" />
                <span className="hidden sm:inline">Scratchpad</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
            
            {/* ACTION & MODE SWITCH BAR */}
            <div className="flex flex-wrap items-center justify-between bg-slate-800/50 border border-slate-800 rounded-2xl p-4 gap-4">
              <div className="flex items-center space-x-2">
                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Mode:</span>
                <div className="inline-flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                  <button
                    onClick={() => {
                      setAppMode('problem');
                      setStep4Result(null);
                    }}
                    className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${
                      appMode === 'problem'
                        ? 'bg-indigo-600 text-white shadow-md'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Direct Answer
                  </button>
                  <button
                    onClick={() => {
                      setAppMode('support');
                      setStep4Result(null);
                    }}
                    className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${
                      appMode === 'support'
                        ? 'bg-indigo-600 text-white shadow-md'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Guided Step-by-Step
                  </button>
                </div>
              </div>

              <div className="flex items-center space-x-3">

              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-2xl p-6 flex flex-col gap-6">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div className="flex items-center space-x-2.5">
                    <Icon name="BookOpen" className="w-5 h-5 text-indigo-400" />
                    <h3 className="text-lg font-bold text-white">Standard Ideal Gas Law (PV = nRT) Reference</h3>
                  </div>
                  <button
                    onClick={() => setShowReference(false)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
                  >
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="grid grid-cols-1 gap-4">
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-2">
                    <span className="font-bold text-amber-400 uppercase tracking-wider text-xs">Gas Constant (R) Value</span>
                    <ul className="text-xs space-y-1.5 font-mono text-slate-300">
                      <li>• <strong className="text-indigo-300">R = 0.0821</strong> L·atm / (mol·K)</li>
                    </ul>
                  </div>

                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-3 text-xs">
                    <span className="font-bold text-indigo-300 text-sm">Isolated Standard Equations</span>
                    <div className="grid grid-cols-2 gap-3 font-mono text-slate-200">
                      <div className="p-2 bg-slate-900 rounded-lg border border-slate-800 text-center">
                        <span className="text-sky-400 font-bold block mb-1">Pressure (P)</span>
                        P = (n × R × T) / V
                      </div>
                      <div className="p-2 bg-slate-900 rounded-lg border border-slate-800 text-center">
                        <span className="text-sky-400 font-bold block mb-1">Volume (V)</span>
                        V = (n × R × T) / P
                      </div>
                      <div className="p-2 bg-slate-900 rounded-lg border border-slate-800 text-center">
                        <span className="text-sky-400 font-bold block mb-1">Moles (n)</span>
                        n = (P × V) / (R × T)
                      </div>
                      <div className="p-2 bg-slate-900 rounded-lg border border-slate-800 text-center">
                        <span className="text-sky-400 font-bold block mb-1">Temperature (T)</span>
                        T = (P × V) / (n × R)
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-2 text-xs">
                    <span className="font-bold text-sky-400 uppercase tracking-wider">Required Unit Conversions</span>
                    <ul className="list-disc list-inside text-slate-300 space-y-1">
                      <li><strong>Temperature (T):</strong> Absolute scale in Kelvin: K = °C + 273.15</li>
                      <li><strong>Volume (V):</strong> Must be in Liters (L): 1 L = 1000 mL</li>
                      <li><strong>Pressure (P):</strong> Must be in atmospheres (atm)</li>
                    </ul>
                  </div>
                </div>

                <button
                  onClick={() => setShowReference(false)}
                  className="bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2.5 rounded-xl transition text-sm self-end px-6"
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* SCRATCHPAD MODAL */}
          {showCalculator && (
            <div className="fixed bottom-6 right-6 z-40 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-5 w-80 animate-fadeIn">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <div className="flex items-center space-x-2">
                  <Icon name="Calculator" className="w-4 h-4 text-sky-400" />
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-200">
                    Converter & R Scratchpad
                  </span>
                </div>
                <button
                  onClick={() => setShowCalculator(false)}
                  className="text-slate-400 hover:text-white"
                >
                  <Icon name="X" className="w-4 h-4" />
                </button>
              </div>

              <div className="flex flex-col gap-3 text-xs">
                <div>
                  <label className="text-slate-400 block mb-1">Celsius to Kelvin (°C → K):</label>
                  <div className="flex items-center space-x-2">
                    <input
                      type="number"
                      placeholder="°C"
                      value={calcC}
                      onChange={(e) => {
                        const val = e.target.value;
                        setCalcC(val);
                        setCalcK(val !== '' ? toSigFigs(parseFloat(val) + 273.15, 3) : '');
                      }}
                      className="w-1/2 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 font-mono text-white outline-none focus:border-sky-500"
                    />
                    <span className="text-slate-500 font-bold">→</span>
                    <input
                      type="number"
                      placeholder="K"
                      value={calcK}
                      readOnly
                      className="w-1/2 bg-slate-950 border border-slate-800 text-amber-300 rounded-lg px-2.5 py-1.5 font-mono outline-none"
                    />
                  </div>
                </div>

                <div className="border-t border-slate-800 pt-2">
                  <span className="text-slate-400 font-semibold block mb-1">Gas Constant (R):</span>
                  <div className="bg-slate-950 p-2 rounded-lg font-mono text-[11px] text-slate-300 space-y-1">
                    <div>• atm: <span className="text-indigo-400 font-bold">0.0821 L·atm/(mol·K)</span></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500 mt-auto">
            Ideal Gas Law Master (PV = nRT) &bull; Interactive Chemistry Learning Tool
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
